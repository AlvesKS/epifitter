name: Linux and macOS package validation

on:
  push:
    branches: [codex/cross-platform-validation]

permissions:
  contents: read

jobs:
  check:
    name: R release on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Verify the tested package snapshot
        run: |
          python3 - <<'PY'
          import csv, hashlib
          from pathlib import Path
          rows = list(csv.DictReader(Path('package-snapshot.csv').open()))
          assert len(rows) == 73
          for row in rows:
              actual = hashlib.sha256((Path('package') / row['Path']).read_bytes()).hexdigest()
              assert actual.upper() == row['SHA256'].upper(), row['Path']
          print('All 73 package files match the validated Windows snapshot.')
          PY
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Record the execution environment
        shell: Rscript {0}
        run: |
          stopifnot(getRversion() >= '4.4')
          print(Sys.info())
          print(sessionInfo())
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: package
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: package
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual")'
          upload-results: true
